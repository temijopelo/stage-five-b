<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Developer Portfolio — Full-stack engineer crafting immersive digital experiences" />
    <meta name="theme-color" content="#080a0f" />

    <!-- Open Graph -->
    <meta property="og:title" content="Dev Portfolio" />
    <meta property="og:description" content="Full-stack engineer crafting immersive digital experiences" />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Clash Display via CDN -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
      rel="stylesheet"
    />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="font-body bg-obsidian-950 text-white">
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
